# 在 GitHub Actions 上构建 Android APK（不依赖本机网络/代理）
#
# 用法：推送后到仓库 Actions 页面，选 “Build APK” → Run workflow；
#       或直接推 main（改了 android/ 等目录会自动触发）。
#       构建完成后在本次运行的 Artifacts 里下载 shuati-debug-apk。
#
# 说明：
#   * runner 自带外网，AGP 8.7.3 / Chaquopy 17 / Gradle 8.9 都能正常下载；
#   * Python 版本必须与 android/app/build.gradle.kts 里的 chaquopy.version 一致（3.14）；
#   * fetch-depth: 0 是为了让 git tag/提交数可用于生成 version.properties。
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "webui/**"
      - "models/**"
      - "utils/**"
      - "convert_tools/**"
      - "data/**"
      - "pictures/**"
      - "webui_server.py"
      - "sync_bank.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 若该版本暂不可用，改成与 chaquopy.version 一致的其他版本
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate version.properties
        run: |
          VERSION_NAME=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          [ -z "$VERSION_NAME" ] && VERSION_NAME=1.0
          printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$(git rev-list --count HEAD)" \
            > android/version.properties
          cat android/version.properties

      - name: Check webui syntax
        run: node --check webui/app.js

      - name: Generate Python sources and seed
        run: python android/prepare_python_src.py

      - name: Verify staging
        run: python android/prepare_python_src.py --check

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shuati-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
