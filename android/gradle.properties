# Gradle 构建参数（本项目不使用 AndroidX，界面是纯 WebView + 原生 Activity）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true

# 若你的 JDK 17/21 不在 JAVA_HOME，可取消下一行注释并改成实际路径
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.12.7-hotspot

# 若 Gradle 下载依赖也需要走代理（国内常见），取消下面四行注释并改成你的代理端口
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890

